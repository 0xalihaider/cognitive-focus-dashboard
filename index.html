<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>@sudohaider | Core Operations</title>
    <style>
        :root {
            --bg: #0f172a;
            --panel: #1e293b;
            --accent: #22d3ee;
            --accent-hover: #06b6d4;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace;
            --font-sans: system-ui, -apple-system, sans-serif;
            --radius: 6px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: var(--font-sans);
            line-height: 1.6;
            padding: 1.5rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            border-bottom: 1px solid var(--border);
            padding-bottom: 1.5rem;
            margin-bottom: 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        h1 { font-family: var(--font-mono); font-size: clamp(1.2rem, 3vw, 1.8rem); color: var(--accent); }
        .status { font-family: var(--font-mono); font-size: clamp(0.9rem, 2vw, 1rem); color: var(--text-muted); background: var(--bg); border: 1px solid var(--border); padding: 0.25rem 0.75rem; border-radius: var(--radius); }

        .grid-layout {
            display: grid;
            grid-template-columns: minmax(300px, 1fr) 2fr;
            gap: 2rem;
            align-items: start;
        }

        .panel {
            background: var(--panel);
            padding: clamp(1rem, 3vw, 2rem);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        h2 { font-size: 1.1rem; margin-bottom: 1.5rem; font-family: var(--font-mono); color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; }
        .section-divider { margin: 2rem 0 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid var(--border); color: var(--text-muted); font-family: var(--font-mono); font-size: 0.85rem; }

        .input-group { margin-bottom: 1.25rem; }
        label { display: block; font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.4rem; font-weight: 500; }
        input[type="time"], input[type="number"] {
            width: 100%;
            padding: 0.75rem;
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            font-family: var(--font-mono);
            border-radius: var(--radius);
            outline: none;
            transition: all 0.2s ease;
            font-size: 1rem;
        }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.2); }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--accent);
            color: var(--bg);
            border: none;
            border-radius: var(--radius);
            font-family: var(--font-mono);
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            margin-top: 1rem;
        }
        button:hover { background: var(--accent-hover); }
        button:active { transform: scale(0.98); }

        /* Dynamic Schedule Items */
        .schedule-item {
            display: flex;
            padding: 1rem;
            border: 1px solid var(--border);
            margin-bottom: 0.5rem;
            border-radius: var(--radius);
            background: var(--bg);
            align-items: center;
            gap: 1rem;
            transition: all 0.3s;
        }
        .schedule-item:hover { border-color: var(--text-muted); }
        
        .time-block { font-family: var(--font-mono); color: var(--accent); font-size: 0.95rem; font-weight: 600; min-width: 160px; }
        .task-block { flex: 1; display: flex; align-items: center; justify-content: space-between; font-weight: 500; }
        
        /* Custom Checkbox */
        .checkbox-wrapper { display: flex; align-items: center; justify-content: center; }
        .task-tick {
            appearance: none;
            width: 1.4rem;
            height: 1.4rem;
            border: 2px solid var(--border);
            border-radius: 4px;
            background: var(--bg);
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
        }
        .task-tick:hover { border-color: var(--accent); }
        .task-tick:checked { background: var(--accent); border-color: var(--accent); }
        .task-tick:checked::after {
            content: '✔';
            position: absolute;
            color: var(--bg);
            font-size: 1rem;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
        }

        /* Completed State */
        .completed-item { opacity: 0.5; border-color: var(--border) !important; background: var(--panel); }
        .completed-item .task-block span:first-child { text-decoration: line-through; color: var(--text-muted); }
        .completed-item .time-block { color: var(--text-muted); }
        
        .type-badge {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
            font-family: var(--font-mono);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        .type-break { background: #3f3f46; color: #e4e4e7; }
        .type-study { background: #164e63; color: #67e8f9; }
        .type-prayer { background: #064e3b; color: #6ee7b7; border: 1px solid #059669; }
        .type-routine { background: #312e81; color: #c4b5fd; }
        .type-maintenance { background: #7c2d12; color: #fdba74; border: 1px solid #c2410c; }
        .type-buffer { background: transparent; border: 1px dashed var(--border); color: var(--text-muted); }

        @media (max-width: 850px) {
            .grid-layout { grid-template-columns: 1fr; }
            .panel { padding: 1.25rem; }
            .schedule-item { flex-wrap: wrap; }
            .time-block { width: 100%; border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; }
            .task-block { width: 100%; margin-top: 0.5rem; }
        }
    </style>
</head>
<body>

    <header>
        <h1>@sudohaider // ENGINE</h1>
        <div class="status" id="clock">00:00:00</div>
    </header>

    <div class="grid-layout">
        <!-- Configuration Panel -->
        <div class="panel">
            <h2>> parameters</h2>
            
            <div class="input-group">
                <label>Target Sleep Time (Initiates 5x 90m Cycles)</label>
                <input type="time" id="sleepTime" value="00:00">
            </div>

            <div class="input-group">
                <label>Virtual Uni Subjects (Daily Load)</label>
                <input type="number" id="subjectCount" value="5" min="1" max="10">
            </div>

            <div class="section-divider">prayer_intervals (Namaz)</div>
            
            <div class="input-group"><label>Fajr</label><input type="time" id="fajr" value="05:30"></div>
            <div class="input-group"><label>Dhuhr</label><input type="time" id="dhuhr" value="13:30"></div>
            <div class="input-group"><label>Asr</label><input type="time" id="asr" value="16:45"></div>
            <div class="input-group"><label>Maghrib</label><input type="time" id="maghrib" value="18:30"></div>
            <div class="input-group"><label>Isha</label><input type="time" id="isha" value="20:00"></div>

            <button id="generateBtn">Re-Compile Sequence</button>
        </div>

        <!-- Output Panel -->
        <div class="panel">
            <h2>> execution_stack</h2>
            <div id="scheduleOutput">
                <p style="color: var(--text-muted); font-size: 0.95rem; font-family: var(--font-mono);">Awaiting compilation or system restore...</p>
            </div>
        </div>
    </div>

    <script>
        const clockEl = document.getElementById('clock');
        const generateBtn = document.getElementById('generateBtn');
        const scheduleOutput = document.getElementById('scheduleOutput');
        const allInputs = document.querySelectorAll('input[type="time"], input[type="number"]');
        
        let systemState = {
            completedBlocks: [], 
            pendingQueue: [],    
            completedFixed: [],  
            lastShiftMins: 0     
        };

        let activeAlarms = [];
        let alarmInterval = null;

        // Auto-Save Inputs
        allInputs.forEach(input => {
            input.addEventListener('input', () => localStorage.setItem(input.id, input.value));
        });

        setInterval(() => {
            clockEl.innerText = new Date().toLocaleTimeString('en-US', { hour12: true });
        }, 1000);

        function timeToMins(timeStr) {
            if (!timeStr) return 0;
            const [hours, minutes] = timeStr.split(':').map(Number);
            return (hours * 60) + minutes;
        }

        function minsToTimeStr(mins) {
            let totalMins = mins % 1440; 
            if (totalMins < 0) totalMins += 1440;
            const h = Math.floor(totalMins / 60);
            const m = totalMins % 60;
            const period = h >= 12 ? 'PM' : 'AM';
            const h12 = h % 12 === 0 ? 12 : h % 12;
            const padM = m.toString().padStart(2, '0');
            return `${h12}:${padM} ${period}`;
        }

        function getRealNowMins() {
            const now = new Date();
            return (now.getHours() * 60) + now.getMinutes();
        }

        async function initNotifications() {
            if (!("Notification" in window)) return false;
            let perm = Notification.permission;
            if (perm !== "granted") perm = await Notification.requestPermission();
            return perm === "granted";
        }

        // ==========================================
        // 1. ENGINE INITIALIZATION (FRESH START)
        // ==========================================
        generateBtn.addEventListener('click', async () => {
            await initNotifications();
            
            // Reset State completely
            systemState.completedBlocks = [];
            systemState.completedFixed = [];
            systemState.pendingQueue = [];
            
            const sleepMins = timeToMins(document.getElementById('sleepTime').value);
            const wakeMins = sleepMins + 450; // 5 cycles * 90m
            const subjectCount = parseInt(document.getElementById('subjectCount').value);

            // Populate the logical sequence queue
            systemState.pendingQueue.push({ id: 'boot', title: 'System Boot & Morning Prep', duration: 60, type: 'routine' });
            
            let totalBlocks = 2 + subjectCount; 
            for(let i = 1; i <= totalBlocks; i++) {
                let taskName = i <= 2 ? `Frontend Masters (Watch → Practice)` : `VU Degree Module ${i - 2}`;
                systemState.pendingQueue.push({ id: `study_${i}`, title: `[Focus] ${taskName}`, duration: 50, type: 'study' });
                if (i !== totalBlocks) {
                    systemState.pendingQueue.push({ id: `break_${i}`, title: 'Cognitive Sandbox', duration: 10, type: 'break' });
                }
            }

            systemState.lastShiftMins = wakeMins;
            renderArchitecture();
        });

        // ==========================================
        // 2. RENDER ARCHITECTURE (SELF-HEALING)
        // ==========================================
        function renderArchitecture() {
            scheduleOutput.innerHTML = '';
            activeAlarms = [];

            // 1. Render Completed History
            systemState.completedBlocks.forEach(block => {
                scheduleOutput.innerHTML += `
                    <div class="schedule-item completed-item">
                        <div class="checkbox-wrapper"><input type="checkbox" class="task-tick" checked disabled></div>
                        <div class="time-block">${block.timeStr}</div>
                        <div class="task-block">
                            <span>${block.title}</span>
                            <span class="type-badge type-${block.type}">${block.type}</span>
                        </div>
                    </div>`;
            });

            if(systemState.pendingQueue.length === 0 && systemState.completedBlocks.length > 0) {
                scheduleOutput.innerHTML += `<p style="color: var(--accent); font-family: var(--font-mono); margin-top: 1rem;">> EXECUTION COMPLETE. ALL SYSTEMS SHUT DOWN.</p>`;
                saveState();
                return;
            }

            // 2. Calculate Pending Sequence with Time-Drift
            let simMins = systemState.lastShiftMins;
            const sleepMins = timeToMins(document.getElementById('sleepTime').value);

            // Gather Fixed Events & normalize for midnight wrapping
            let fixedEvents = [
                { id: 'fajr', name: 'Namaz: Fajr', mins: timeToMins(document.getElementById('fajr').value), duration: 30, type: 'prayer' },
                { id: 'dhuhr', name: 'Namaz: Dhuhr', mins: timeToMins(document.getElementById('dhuhr').value), duration: 30, type: 'prayer' },
                { id: 'asr', name: 'Namaz: Asr', mins: timeToMins(document.getElementById('asr').value), duration: 30, type: 'prayer' },
                { id: 'maghrib', name: 'Namaz: Maghrib', mins: timeToMins(document.getElementById('maghrib').value), duration: 30, type: 'prayer' },
                { id: 'isha', name: 'Namaz: Isha', mins: timeToMins(document.getElementById('isha').value), duration: 30, type: 'prayer' },
                { id: 'maintenance', name: 'Maintenance Window', mins: 780, duration: 60, type: 'maintenance' }
            ].map(e => {
                // If event is early AM but sleep was late PM, it happens the "next" day logically
                let nMins = e.mins;
                if(sleepMins > 720 && nMins < 720) nMins += 1440;
                return { ...e, nMins };
            }).filter(e => !systemState.completedFixed.includes(e.id) && e.nMins >= simMins) // Only future uncompleted
              .sort((a, b) => a.nMins - b.nMins);

            const pushToUI = (id, title, duration, type, isQueueItem, isFixedItem) => {
                const startStr = minsToTimeStr(simMins);
                const endMins = simMins + duration;
                const endStr = minsToTimeStr(endMins);
                
                const metaData = `data-id="${id}" data-title="${title}" data-type="${type}" data-isqueue="${isQueueItem}" data-isfixed="${isFixedItem}"`;
                const isBuffer = type === 'buffer';
                
                scheduleOutput.innerHTML += `
                    <div class="schedule-item">
                        <div class="checkbox-wrapper">
                            ${!isBuffer ? `<input type="checkbox" class="task-tick" ${metaData}>` : `<span style="width:1.4rem;"></span>`}
                        </div>
                        <div class="time-block">${startStr} - ${endStr}</div>
                        <div class="task-block">
                            <span>${title}</span>
                            <span class="type-badge type-${type}">${type}</span>
                        </div>
                    </div>`;

                let alarmTimeH = Math.floor((simMins % 1440) / 60).toString().padStart(2, '0');
                let alarmTimeM = ((simMins % 1440) % 60).toString().padStart(2, '0');
                activeAlarms.push({ time: `${alarmTimeH}:${alarmTimeM}`, title: "Architecture Update", msg: `Initiated: ${title}` });

                simMins = endMins;
            };

            // Loop Queue and Apply Collision Logic
            for (let i = 0; i < systemState.pendingQueue.length; i++) {
                let queueItem = systemState.pendingQueue[i];
                let eventFound = true;

                while(eventFound && fixedEvents.length > 0) {
                    eventFound = false;
                    let event = fixedEvents[0];
                    
                    if (simMins >= event.nMins && simMins < (event.nMins + event.duration)) {
                        pushToUI(event.id, event.name, (event.nMins + event.duration) - simMins, event.type, false, true);
                        fixedEvents.shift();
                        eventFound = true;
                    } 
                    else if (event.nMins > simMins && event.nMins < (simMins + queueItem.duration)) {
                        let offset = event.nMins - simMins;
                        pushToUI('buffer', 'System Buffer', offset, 'buffer', false, false);
                        pushToUI(event.id, event.name, event.duration, event.type, false, true);
                        fixedEvents.shift();
                        eventFound = true;
                    }
                }
                
                pushToUI(queueItem.id, queueItem.title, queueItem.duration, queueItem.type, true, false);
            }

            saveState();
            startAlarmLoop();
        }

        // ==========================================
        // 3. EVENT DELEGATION (TICKING LOGIC)
        // ==========================================
        scheduleOutput.addEventListener('change', (e) => {
            if (e.target.classList.contains('task-tick') && e.target.checked) {
                const id = e.target.dataset.id;
                const title = e.target.dataset.title;
                const type = e.target.dataset.type;
                const isQueue = e.target.dataset.isqueue === 'true';
                const isFixed = e.target.dataset.isfixed === 'true';
                
                const nowMins = getRealNowMins();
                const completionStr = `Done @ ${minsToTimeStr(nowMins)}`;

                // Log Completion
                systemState.completedBlocks.push({ id, title, timeStr: completionStr, type });

                // Process Queue Removal or Fixed Event Logging
                if (isQueue) {
                    systemState.pendingQueue = systemState.pendingQueue.filter(item => item.id !== id);
                } else if (isFixed) {
                    systemState.completedFixed.push(id);
                }

                // DRIFT THE TIMELINE: The rest of the schedule now starts from exactly right now.
                systemState.lastShiftMins = nowMins;
                renderArchitecture();
            }
        });

        // ==========================================
        // 4. STORAGE & ALARM MANAGEMENT
        // ==========================================
        function saveState() {
            localStorage.setItem('sudoEngineState', JSON.stringify(systemState));
        }

        function loadState() {
            allInputs.forEach(input => {
                const saved = localStorage.getItem(input.id);
                if(saved) input.value = saved;
            });
            const savedState = localStorage.getItem('sudoEngineState');
            if (savedState) {
                systemState = JSON.parse(savedState);
                renderArchitecture();
            }
        }

        function startAlarmLoop() {
            if (alarmInterval) clearInterval(alarmInterval);
            let lastNotifiedTime = null;
            alarmInterval = setInterval(() => {
                const now = new Date();
                const current24h = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
                if (lastNotifiedTime !== current24h) {
                    const alarm = activeAlarms.find(a => a.time === current24h);
                    if (alarm && Notification.permission === "granted") {
                        new Notification(alarm.title, { body: alarm.msg });
                        lastNotifiedTime = current24h;
                    }
                }
            }, 5000); 
        }

        // Boot
        loadState();
    </script>
</body>
</html>
